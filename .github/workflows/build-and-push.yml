name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Updated to include the 'latest' tag
      - name: Build and push image 
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile  
          push: true
          tags: |
            lavalex/snake-game:${{ github.sha }}
            lavalex/snake-game:latest

      - name: Update GitOps Repository
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Clone the gitops repo
          git clone https://x-access-token:${{ secrets.GIT_ACCESS_TOKEN }}@github.com/lavalex/snake-gitops.git
          cd snake-gitops
          
          # Use a more flexible regex that matches everything after 'image: '
          sed -i "s|image: .*|image: docker.io/lavalex/snake-game:${{ github.sha }}|g" deployment-game.yaml
          
          # Only commit if there are changes
          if [[ -n $(git status -s) ]]; then
            git add deployment-game.yaml
            git commit -m "Update image tag to ${{ github.sha }}"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Purge old images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          REPO: lavalex/snake-game
        run: |
          # 1. Get Auth Token
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKER_USERNAME\", \"password\": \"$DOCKER_PASSWORD\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
            
          # 2. List tags (excluding 'latest'), sort by creation date (newest first), and skip the first 3
          # Updated jq filter to actually exclude the 'latest' tag
          echo "Fetching tags for $REPO..."
          TAGS_TO_DELETE=$(curl -s -H "Authorization: Bearer $TOKEN" "https://hub.docker.com/v2/repositories/$REPO/tags/?page_size=100" | jq -r '.results[] | select(.name != "latest") | .name' | tail -n +4)
          
          # 3. Delete the tags
          for tag in $TAGS_TO_DELETE; do
            echo "Deleting tag: $tag"
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://hub.docker.com/v2/repositories/$REPO/tags/$tag/"
          done